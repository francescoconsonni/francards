<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="popup.css">
<title>Francards</title>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <img src="icons/icon-32.png" width="24" height="24">

        <div>
            <strong>Francards</strong>
            <div id="source" class="source">
                capturando...
            </div>
        </div>
    </div>

    <div class="top-actions">

        <button
            id="toggleTheme"
            class="btn-icon"
            title="Alternar tema">
            🌙
        </button>

        <button
            id="recapture"
            class="btn-icon"
            title="Capturar novamente">
            ↻
        </button>

        <button
            id="toggleConfig"
            class="btn-icon"
            title="Configurações">
            ⚙
        </button>

    </div>

</header>


<section
    id="configPanel"
    class="config-panel"
    hidden>

    <h3>Configurações</h3>

    <div class="field-row">

        <label class="field">

            <span>IA</span>

            <select id="provider">
                <option value="gemini">Gemini</option>
                <option value="deepseek">DeepSeek</option>
            </select>

        </label>

        <label class="field">

            <span>Formato</span>

            <select id="formato">
                <option value="qa">Pergunta / Resposta</option>
                <option value="cloze">Cloze</option>
                <option value="ambos">Ambos</option>
            </select>

        </label>

    </div>

    <label class="field">

        <span>API Key</span>

        <input
            id="apiKey"
            type="password">

    </label>

    <label class="field">

        <span>Baralho</span>

        <input
            id="deckName"
            type="text">

    </label>

    <label class="field">

        <span>Tags</span>

        <input
            id="tags"
            type="text">

    </label>

    <details>

        <summary>Configurações avançadas</summary>

        <label class="field">
            <span>Modelo</span>
            <input id="modelName">
        </label>

        <label class="field">
            <span>Modelo Cloze</span>
            <input id="clozeModelName">
        </label>

        <label class="field">
            <span>Campo Frente</span>
            <input id="frontField">
        </label>

        <label class="field">
            <span>Campo Verso</span>
            <input id="backField">
        </label>

        <label class="field">
            <span>Campo Cloze</span>
            <input id="clozeField">
        </label>

        <label class="field">
            <span>AnkiConnect URL</span>
            <input
                id="ankiUrl"
                value="http://127.0.0.1:8765">
        </label>

        <label class="field">
            <span>Chave AnkiConnect</span>
            <input
                id="ankiApiKey"
                type="password">
        </label>

    </details>

</section>


<textarea
    id="captured"
    rows="8"
    placeholder="Cole ou capture a resolução..."></textarea>


<button
    id="generate"
    class="btn-primary">

    Gerar Flashcards

</button>


<p
    id="status"
    class="status">
</p>


<section
    id="resultsSection"
    hidden>

    <div class="results-header">

        <span
            id="resultsLabel">
        </span>

        <div>

            <button
                id="sendAllBtn"
                class="btn-sm">

                Enviar tudo

            </button>

            <button
                id="downloadBtn"
                class="btn-sm">

                TXT

            </button>

            <button
                id="openSiteBtn"
                class="btn-sm">

                Site

            </button>

        </div>

    </div>

    <div id="cardsContainer"></div>

</section>

<script src="extractor.js"></script>
<script src="popup.js"></script>

</body>
</html>
